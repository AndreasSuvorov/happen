<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0f0f10;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f10;padding:32px 0;">
      <tr>
        <td align="center">
          <table width="400" cellpadding="0" cellspacing="0" style="background:#1a1a1c;border:1px solid #2a2a2d;border-radius:12px;padding:32px;">
            <tr>
              <td style="color:#f2f2f2;font-size:20px;font-weight:600;padding-bottom:16px;">Happen</td>
            </tr>
            <tr>
              <td style="color:#9a9a9e;font-size:15px;padding-bottom:24px;">
                Dein Anmeldecode, gültig für 1 Stunde. Gib ihn in der App ein, wenn du auf einem anderen Gerät als deinem Postfach bist:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <span style="display:inline-block;background:#0f0f10;border:1px solid #2a2a2d;border-radius:8px;padding:16px 24px;color:#4ade80;font-size:32px;font-weight:700;letter-spacing:6px;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="color:#9a9a9e;font-size:14px;padding-bottom:12px;">
                Oder direkt anmelden, falls du diese Mail auf dem Gerät öffnest, auf dem du Happen nutzen willst:
              </td>
            </tr>
            <tr>
              <td>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4ade80;color:#0f0f10;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px;">Jetzt einloggen</a>
              </td>
            </tr>
            <tr>
              <td style="color:#6a6a6e;font-size:12px;padding-top:24px;">
                Nicht angefordert? Einfach ignorieren.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
